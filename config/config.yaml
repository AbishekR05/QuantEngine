# Global pipeline settings
ticker: "^NSEI"
start_date: "2007-09-17"
end_date: null  # Set to null or empty string to fetch data up to the current date dynamically

# Data storage paths (relative to project root)
db_path: "database/quantengine.db"
raw_data_dir: "data/raw"
processed_data_dir: "data/processed"
features_data_dir: "data/features"
versions_dir: "data/versions"

# Exploratory Data Analysis (EDA) configuration
eda:
  input_files:
    clean: "data/processed/nsei_clean.csv"
    features: "data/features/nifty_features.csv"
  output_dir: "reports/eda/statistics/"
  date_column: "Date"
  statistics:
    exclude_columns:
      - Date
    skew_threshold: 1.0
    kurtosis_threshold: 3.0
  figures:
    output_dir: "reports/eda/figures/"
    dpi: 150
    figure_size:
      - 12
      - 6
    rolling_volatility_window: 21
    ema_periods:
      - 20
      - 50
      - 200
    rsi_overbought: 70
    rsi_oversold: 30
  correlation:
    input_file: "data/features/nifty_features.csv"
    exclude_columns:
      - Date
    high_corr_threshold: 0.9
    leakage_threshold: 0.99
    top_n_pairs: 20
    heatmap_output_dir: "reports/eda/figures/"
    report_output_path: "reports/eda/statistics/correlation_report.md"
  outliers:
    known_events_path: "config/known_events.yaml"
    exclude_columns:
      - Date
    iqr_multiplier: 1.5
    zscore_threshold: 3.0
    top_n_per_column: 20
    output_dir: "reports/eda/figures/outliers/"
    report_output_path: "reports/eda/statistics/outlier_report.md"
  regime:
    input_file: "data/features/nifty_features.csv"
    trend_window: 63
    trend_threshold: 0.05
    vol_window: 21
    vol_high_percentile: 0.75
    vol_low_percentile: 0.25
    known_events_path: "config/known_events.yaml"
    output_report_path: "reports/eda/statistics/regime_report.md"
    output_chart_path: "reports/eda/figures/regime_timeline.png"
  feature_usefulness:
    input_file: "data/features/nifty_features.csv"
    exclude_columns:
      - Date
    correlation_report_source: "reports/eda/statistics/correlation_report.md"
    mi_bins: 10
    output_report_path: "reports/eda/statistics/feature_usefulness_report.md"
  label_engineering:
    input_file: "data/features/nifty_features.csv"
    close_column: "Close"
    three_class_threshold: 0.005
    output_dir: "data/labels/"
    binary_output_filename: "nifty_labels_v1_binary.csv"
    three_class_output_filename: "nifty_labels_v2_threeclass.csv"
    report_output_path: "reports/eda/statistics/label_engineering_report.md"
  scaling:
    bounded_columns:
      - RSI_14
    output_report_path: "reports/eda/statistics/scaling_recommendation_report.md"
  final_report:
    output_report_path: "reports/eda/EDA_REPORT.md"
  feature_store:
    output_dir: "data/feature_store/"
    version: 1
    format: "parquet"
    validation_level: "warn_non_critical"
  walk_forward:
    anchor_start_year: 2014
    fold_schedule: "expanding"
    folds:
      - {train_end_year: 2018, test_year: 2019}
      - {train_end_year: 2019, test_year: 2020}
      - {train_end_year: 2020, test_year: 2021}
      - {train_end_year: 2021, test_year: 2022}
      - {train_end_year: 2022, test_year: 2023}
      - {train_end_year: 2023, test_year: 2024}
      - {train_end_year: 2024, test_year: 2025}
      - {train_end_year: 2025, test_year: 2026, partial: true}
    embargo_days: 0
    feature_store_version: 1
    label_version: "threeclass"
    persist_fold_artifacts: true
  baseline_benchmarking:
    models:
      logistic_regression:
        seed: 42
        class_weight: "balanced"
        calibration_method: "platt"
        calibration_cv: 5
      decision_tree:
        seed: 42
        class_weight: "balanced"
        calibration_method: "isotonic"
        calibration_cv: 5
      random_forest:
        seed: 42
        n_estimators: 100
        class_weight: "balanced"
        calibration_method: "isotonic"
        calibration_cv: 5
      xgboost:
        seed: 42
        n_estimators: 100
        learning_rate: 0.1
        scale_pos_weight_mode: "balanced"
        calibration_method: "platt"
        calibration_cv: 5
      lightgbm:
        seed: 42
        n_estimators: 100
        learning_rate: 0.1
        class_weight: "balanced"
        calibration_method: "platt"
        calibration_cv: 5
    viability_gate:
      metric: "macro_f1"
      min_margin_over_naive_baseline: 0.05
      min_passing_folds: 5
    stability_threshold: 0.10
    feature_store_version: 1
    label_version: "threeclass"
    walk_forward_run_id: "fs_v1_threeclass_embargo0"
  hyperparameter_optimization:
    eligible_models: ["logistic_regression", "xgboost", "lightgbm"]
    excluded_models:
      decision_tree: "failed viability gate (0/8)"
      random_forest: "failed viability gate (0/8)"
    study:
      sampler: "tpe"
      sampler_seed: 123
      n_trials: 50
      timeout_seconds: null
      pruner: "median"
    objective:
      primary_metric: "macro_f1_calibrated"
      aggregate_folds: [1, 2, 3, 4, 5, 6, 7]
      secondary_metric: "fold_stability_max_deviation"
    search_spaces:
      logistic_regression:
        active: true
        C: {type: "log_uniform", low: 0.0001, high: 100.0}
        penalty: {type: "categorical", choices: ["l2", "l1", "elasticnet"]}
        solver: {type: "categorical", choices: ["lbfgs", "saga"]}
        l1_ratio: {type: "uniform", low: 0.0, high: 1.0}
        max_iter: 1000
        class_weight: "balanced"
        random_state: 42
        calibration_method: "platt"
        n_trials: 50
      xgboost:
        active: true
        learning_rate: {type: "log_uniform", low: 0.01, high: 0.3}
        max_depth: {type: "int", low: 2, high: 10}
        n_estimators: {type: "int", low: 50, high: 500}
        subsample: {type: "uniform", low: 0.5, high: 1.0}
        colsample_bytree: {type: "uniform", low: 0.5, high: 1.0}
        min_child_weight: {type: "uniform", low: 1.0, high: 10.0}
        reg_alpha: {type: "log_uniform", low: 1e-8, high: 1.0}
        reg_lambda: {type: "log_uniform", low: 1e-8, high: 1.0}
        random_state: 42
        calibration_method: "platt"
        n_trials: 20
      lightgbm:
        active: true
        learning_rate: {type: "log_uniform", low: 0.01, high: 0.3}
        max_depth: {type: "int", low: 2, high: 10}
        num_leaves: {type: "int", low: 10, high: 150}
        n_estimators: {type: "int", low: 50, high: 500}
        min_child_samples: {type: "int", low: 10, high: 100}
        subsample: {type: "uniform", low: 0.5, high: 1.0}
        colsample_bytree: {type: "uniform", low: 0.5, high: 1.0}
        reg_alpha: {type: "log_uniform", low: 1e-8, high: 1.0}
        reg_lambda: {type: "log_uniform", low: 1e-8, high: 1.0}
        class_weight: "balanced"
        random_state: 42
        calibration_method: "platt"
        n_trials: 20
    feature_store_version: 1
    label_version: "threeclass"
    walk_forward_run_id: "fs_v1_threeclass_embargo0"
  explainability:
    enabled_methods:
      logistic_regression: ["coefficients", "standardized_coefficients", "sign_stability"]
      xgboost: ["native_importance", "shap_global", "shap_local", "shap_interaction"]
      lightgbm: ["shap_global", "shap_local"]
    shap:
      background_sample_size: 500
      interaction_row_ceiling: 2000
      seed: 77
    local_explanations:
      n_correct_samples_per_class: 5
      n_misclassified_samples: 10
      seed: 77
    stability:
      top_k: 15
    output:
      base_directory: "explainability_runs"
    versioning:
      feature_store_version: 1
      label_version: "threeclass"
      walk_forward_run_id: "fs_v1_threeclass_embargo0"
  backtesting:
    initial_capital: 1000000
    execution_lag_days: 1
    signal_generation:
      thresholding_enabled: true
      confidence_thresholds:
        logistic_regression:
          buy_threshold: 0.55
          sell_threshold: 0.55
        xgboost:
          buy_threshold: 0.55
          sell_threshold: 0.55
        lightgbm:
          buy_threshold: 0.55
          sell_threshold: 0.55
    position:
      max_open_positions: 1
      allow_scaling_into_position: false
    transaction_costs:
      idealized:
        brokerage: 0.0
        slippage: 0.0
        exchange_fees: 0.0
        taxes: 0.0
        spread: 0.0
        commission: 0.0
      realistic:
        brokerage: 0.0003
        slippage: 0.0005
        exchange_fees: 0.0001
        taxes: 0.001
        spread: 0.0002
        commission: 0.0002
    risk_management:
      stop_loss: {enabled: true, value: 0.02}
      take_profit: {enabled: true, value: 0.04}
      trailing_stop: {enabled: false, value: null}
      max_holding_days: 10
      risk_per_trade: 0.01
    benchmarks:
      - "buy_and_hold"
      - "naive_classifier"
      - "always_long"
      - "always_flat"
      - "previous_step_baseline"
    versioning:
      feature_store_version: 1
      label_version: "threeclass"
      walk_forward_run_id: "fs_v1_threeclass_embargo0"
